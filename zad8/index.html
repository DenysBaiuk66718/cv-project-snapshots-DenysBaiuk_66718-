<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV - Denys Baiuk</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="green-theme">
    <div id="controls" style="text-align: center; margin-top: 20px">
      <button id="themeToggle">Zmień motyw (Zielony/Czerwony)</button>
      <button id="sectionToggle">Ukryj/Pokaż Umiejętności</button>
    </div>
    <section id="contactSection">
      <!--ZADANIE 7: Local Storage -->
      <section id="goalsSection">
        <h2>Moje Cele / Notatki</h2>
        <div
          class="form-group"
          style="display: flex; gap: 10px; max-width: 400px"
        >
          <input
            type="text"
            id="goalInput"
            placeholder="Wpisz nowy cel..."
            style="flex-grow: 1; padding: 8px"
          />
          <button id="addGoalBtn" style="padding: 8px 15px; cursor: pointer">
            Dodaj
          </button>
        </div>

        <ul
          id="goalsList"
          style="
            list-style-type: none;
            padding: 0;
            max-width: 400px;
            margin-top: 15px;
          "
        ></ul>
      </section>
      <h2>Kontakt</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="firstName">Imię:</label>
          <input type="text" id="firstName" name="firstName" />
          <span class="error-message" id="firstNameError"></span>
        </div>

        <div class="form-group">
          <label for="lastName">Nazwisko:</label>
          <input type="text" id="lastName" name="lastName" />
          <span class="error-message" id="lastNameError"></span>
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" />
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="message">Wiadomość:</label>
          <textarea id="message" name="message" rows="4"></textarea>
          <span class="error-message" id="messageError"></span>
        </div>

        <button type="submit">Wyślij</button>
        <p
          id="successMessage"
          style="
            display: none;
            color: green;
            font-weight: bold;
            margin-top: 10px;
          "
        >
          Formularz wysłany pomyślnie!
        </p>
      </form>
    </section>

    <div class="cv-container">
      <div class="header">
        <img src="photo.jpg" alt="Zdjęcie Denys Baiuk" class="profile-photo" />
        <h1>Denys Baiuk</h1>
        <p class="index-number">nr albumu: 66718</p>
        <h2>Student Informatyki | Przyszły Programista</h2>
      </div>

      <section id="skills-section">
        <h2>Moje Umiejętności</h2>
        <ul id="skillsList"></ul>
      </section>

      <section id="projectsSection">
        <h2>Moje Projekty</h2>
        <div id="projectsList"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
